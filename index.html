<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Утя🐥Art. Игра в мяч.</title>
    <style>
        /* CSS resets and full-screen setup */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            /* CSS-based Grass Field (Mowed Stripes) */
            background-color: #3b7a33;
            background-image: repeating-linear-gradient(
                    0deg,
                    transparent,
                    transparent 100px,
                    rgba(0, 0, 0, 0.08) 100px,
                    rgba(0, 0, 0, 0.08) 200px
            );
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden; /* Prevent scrolling */
            touch-action: none; /* Crucial for touch-screen games */
        }

        canvas {
            display: block;
        }

        /* Top Bar Container (Combines Buttons and Score) */
        #topBar {
            position: absolute;
            top: 20px;
            width: 100%;
            display: none;
            justify-content: center;
            align-items: center;
            gap: 20px;
            z-index: 20;
            pointer-events: none;
        }

        /* Scoreboard */
        #scoreboard {
            font-size: 50px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            white-space: nowrap;
        }

        #scoreboard span {
            padding: 0 15px;
        }

        /* Buttons */
        .control-btn {
            pointer-events: auto;
            background: rgba(255, 255, 255, 0.9);
            color: #1a1a1a;
            border: none;
            padding: 10px 15px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: transform 0.1s, background 0.2s, opacity 0.1s;
        }

        .control-btn:hover {
            background: #65b8ff;
        }

        .control-btn:active {
            transform: scale(0.95);
            background: #ccc;
            opacity: 0.6; /* Эффект прозрачности при нажатии */
        }

        /* Responsive Menu UI */
        #menu {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 30;
            padding: 20px;
            box-sizing: border-box;
        }

        #menu h1 {
            font-size: 10vh;
            margin: 0 0 4vh 0;
            letter-spacing: 5px;
        }

        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 90%;
            max-width: 400px;
        }

        .href-container a {
            font-size: 5vh;
            text-decoration: none;
            margin-bottom: 4vh;
            display: inline-block;
            color: white;
        }

        .href-container a:hover {
            color: #65b8ff;
            text-decoration: underline;
        }

        .btn {
            background: #fff;
            color: #1a1a1a;
            border: none;
            padding: 15px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.1s, background 0.2s;
            text-align: center;
        }

        .btn:hover {
            background: #65b8ff;
        }

        .btn:active {
            transform: scale(0.95);
            background: #ccc;
        }

        /* Landscape orientation adjustment for mobile */
        @media (orientation: landscape) and (max-height: 500px) {
            #menu h1 {
                font-size: 6vh;
                margin-bottom: 2vh;
            }
            .btn-container {
                flex-direction: row;
                flex-wrap: wrap;
                justify-content: center;
                max-width: 600px;
            }
            .btn {
                font-size: 1rem;
                padding: 10px;
                flex: 1 1 40%;
                max-width: 250px;
            }
            #topBar {
                top: 10px;
                gap: 10px;
            }
            .control-btn {
                padding: 5px 10px;
                font-size: 0.9rem;
            }
            #scoreboard {
                font-size: 40px;
            }
        }
    </style>
</head>
<body>

<!-- Unified Top Bar for Score and Controls -->
<div id="topBar">
    <button id="pauseBtn" class="control-btn" onclick="togglePause()">Пауза</button>
    <div id="scoreboard"><span id="score1">0</span> - <span id="score2">0</span></div>
    <button id="fullscreenBtn" class="control-btn" onclick="toggleFullscreen()">Полный экран</button>
    <button id="exitBtn" class="control-btn" onclick="exitGame()">Выход из игры</button>
</div>

<div id="menu">
    <h1>Утя🐥Art. Игра в мяч.</h1>
    <div class="href-container"><a href="https://www.youtube.com/@Utj_Art" target="_blank">Переходи на youtube канал</a></div>
    <div class="btn-container">
        <button class="btn" onclick="startGame('bot', 'easy')">1 Игрок - Новичок</button>
        <button class="btn" onclick="startGame('bot', 'medium')">1 Игрок - Любитель</button>
        <button class="btn" onclick="startGame('bot', 'hard')">1 Игрок - Профессионал</button>
        <button class="btn" onclick="startGame('2p', null)">2 Игрока</button>
    </div>
</div>

<canvas id="gameCanvas"></canvas>

       1. CONFIGURATION & VARIABLES (PNG Images)

    // Helper function to generate default Transparent PNGs so the game runs immediately.
    function generateDefaultPNG(color, size) {
        const tempCanvas = document.createElement('canvas');
        tempCanvas.width = size;
        tempCanvas.height = size;
        const tCtx = tempCanvas.getContext('2d');
        tCtx.fillStyle = color;
        tCtx.beginPath();
        tCtx.arc(size/2, size/2, size/2, 0, Math.PI * 2);
        tCtx.fill();
        return tempCanvas.toDataURL('image/png');
    }

    const ballImageBase64 = generateDefaultPNG('#f1c40f', 50);    // Yellow Ball PNG
    // -------------------------------------------------

    // Load images
    const imgP1 = new Image(); imgP1.src = player1ImageBase64;
    const imgP2 = new Image(); imgP2.src = player2ImageBase64;
    const imgBall = new Image(); imgBall.src = ballImageBase64;

    // Core Game Settings
    const playerDiameter = 100;
    const playerRadius = playerDiameter / 2;
    const ballSize = 25;
    const ballRadius = ballSize / 2;
    const initialBallSpeed = 6;
    const speedMultiplier = 1.05;

    // Canvas Setup
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // Game State Variables
    let isPlaying = false;
    let isPaused = false;
    let gameMode = '2p';
    let botSpeed = 0;

    let score1 = 0;
    let score2 = 0;

    // Entities
    const p1 = { x: 0, y: 0, targetY: 0, radius: playerRadius };
    const p2 = { x: 0, y: 0, targetY: 0, radius: playerRadius };
    const ball = { x: 0, y: 0, dx: 0, dy: 0, speed: initialBallSpeed, radius: ballRadius };

    // Goal Animation State
    let goalAnim = { active: false, x: 0, y: 0, alpha: 0 };

    /* ==========================================
       2. RESIZE & RESPONSIVENESS
       ========================================== */
    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        p1.x = playerRadius + 15;
        p2.x = canvas.width - playerRadius - 15;

        if (!isPlaying) {
            p1.y = canvas.height / 2;
            p2.y = canvas.height / 2;
            p1.targetY = p1.y;
            p2.targetY = p2.y;
        } else if (isPaused) {
            draw(); // Redraw paused frame so it scales correctly
            drawPauseScreen();
        }
    }
    window.addEventListener('resize', resize);
    window.addEventListener('orientationchange', resize);
    resize();

    /* ==========================================
       3. CONTROLS & FULLSCREEN
       ========================================== */
    function toggleFullscreen() {
        const doc = window.document;
        const docEl = doc.documentElement;

        const requestFullScreen = docEl.requestFullscreen || docEl.mozRequestFullScreen || docEl.webkitRequestFullScreen || docEl.msRequestFullscreen;
        const cancelFullScreen = doc.exitFullscreen || doc.mozCancelFullScreen || doc.webkitExitFullscreen || doc.msExitFullscreen;

        if (!doc.fullscreenElement && !doc.mozFullScreenElement && !doc.webkitFullscreenElement && !doc.msFullscreenElement) {
            // Enter fullscreen
            if (requestFullScreen) {
                requestFullScreen.call(docEl).then(() => {
                    // Try to lock orientation to landscape on mobile devices
                    if (screen.orientation && screen.orientation.lock) {
                        screen.orientation.lock('landscape').catch((err) => console.log("Orientation lock not supported or denied."));
                    }
                }).catch(err => {
                    console.log(`Error attempting to enable full-screen mode: ${err.message} (${err.name})`);
                });
            }
        } else {
            // Exit fullscreen
            if (cancelFullScreen) {
                cancelFullScreen.call(doc);
            }
        }
    }

    function handleInput(x, y) {
        if (x < canvas.width / 2) {
            p1.targetY = y;
        } else {
            if (gameMode === '2p') {
                p2.targetY = y;
            }
        }
    }

    window.addEventListener('touchstart', (e) => {
        if(!isPlaying || isPaused) return;
        for (let i = 0; i < e.touches.length; i++) {
            handleInput(e.touches[i].clientX, e.touches[i].clientY);
        }
    });
    window.addEventListener('touchmove', (e) => {
        if(!isPlaying || isPaused) return;
        if(e.target === canvas) e.preventDefault(); // Only prevent scroll if touching canvas
        for (let i = 0; i < e.touches.length; i++) {
            handleInput(e.touches[i].clientX, e.touches[i].clientY);
        }
    }, { passive: false });

    window.addEventListener('mousemove', (e) => {
        if(isPlaying && !isPaused) handleInput(e.clientX, e.clientY);
    });

    /* ==========================================
       4. GAME LOGIC & UI
       ========================================== */

    function startGame(mode, difficulty) {
        gameMode = mode;
        if (mode === 'bot') {
            if (difficulty === 'easy') botSpeed = 0.04;
            if (difficulty === 'medium') botSpeed = 0.09;
            if (difficulty === 'hard') botSpeed = 0.16;
        }

        score1 = 0;
        score2 = 0;
        isPaused = false;
        goalAnim.active = false;

        document.getElementById('pauseBtn').innerText = "Пауза";
        updateScoreboard();

        document.getElementById('menu').style.display = 'none';
        document.getElementById('topBar').style.display = 'flex';
        isPlaying = true;

        resize();
        resetBall();
        requestAnimationFrame(gameLoop);
    }

    function togglePause() {
        isPaused = !isPaused;
        const pauseBtn = document.getElementById('pauseBtn');

        if (isPaused) {
            pauseBtn.innerText = "Продолжить";
            drawPauseScreen();
        } else {
            pauseBtn.innerText = "Пауза";
            requestAnimationFrame(gameLoop); // Resume loop
        }
    }

    function exitGame() {
        isPlaying = false;
        isPaused = false;
        document.getElementById('menu').style.display = 'flex';
        document.getElementById('topBar').style.display = 'none';

        if (document.exitFullscreen) {
            document.exitFullscreen().catch(err => console.log(err));
        }
    }

    function resetBall() {
        ball.x = canvas.width / 2;
        ball.y = canvas.height / 2;
        ball.speed = initialBallSpeed;
        let angle = (Math.random() * Math.PI / 2) - Math.PI / 4;
        let direction = (Math.random() > 0.5 ? 1 : -1);

        ball.dx = direction * ball.speed * Math.cos(angle);
        ball.dy = ball.speed * Math.sin(angle);
    }

    function updateScoreboard() {
        document.getElementById('score1').innerText = score1;
        document.getElementById('score2').innerText = score2;
    }

    function showGoalAnimation(x, y) {
        goalAnim.active = true;
        goalAnim.x = x;
        goalAnim.y = y;
        goalAnim.alpha = 1.0;
    }

    function getDistance(x1, y1, x2, y2) {
        return Math.sqrt(Math.pow(x2 - x1, 2) + Math.pow(y2 - y1, 2));
    }

    function update() {
        p1.y += (p1.targetY - p1.y) * 0.2;

        if (gameMode === 'bot') {
            p2.targetY = ball.y;
            p2.y += (p2.targetY - p2.y) * botSpeed;
        } else {
            p2.y += (p2.targetY - p2.y) * 0.2;
        }

        p1.y = Math.max(playerRadius, Math.min(canvas.height - playerRadius, p1.y));
        p2.y = Math.max(playerRadius, Math.min(canvas.height - playerRadius, p2.y));

        ball.x += ball.dx;
        ball.y += ball.dy;

        if (ball.y - ball.radius <= 0) {
            ball.dy = Math.abs(ball.dy);
            ball.y = ball.radius;
        } else if (ball.y + ball.radius >= canvas.height) {
            ball.dy = -Math.abs(ball.dy);
            ball.y = canvas.height - ball.radius;
        }

        let playerToCheck = (ball.dx < 0) ? p1 : p2;
        let distance = getDistance(ball.x, ball.y, playerToCheck.x, playerToCheck.y);

        if (distance < ball.radius + playerToCheck.radius) {
            if ((playerToCheck === p1 && ball.dx < 0) || (playerToCheck === p2 && ball.dx > 0)) {
                let hitFactor = (ball.y - playerToCheck.y) / playerToCheck.radius;
                let angle = hitFactor * (Math.PI / 3);

                ball.speed *= speedMultiplier;

                let direction = (playerToCheck === p1) ? 1 : -1;
                ball.dx = direction * ball.speed * Math.cos(angle);
                ball.dy = ball.speed * Math.sin(angle);

                let overlap = (ball.radius + playerToCheck.radius) - distance;
                let vx = ball.x - playerToCheck.x;
                let vy = ball.y - playerToCheck.y;
                let unitX = vx / distance;
                let unitY = vy / distance;
                ball.x += unitX * (overlap + 1);
                ball.y += unitY * (overlap + 1);
            }
        }

        // Scoring
        if (ball.x + ball.radius < 0) {
            score2++;
            updateScoreboard();
            showGoalAnimation(canvas.width / 4, canvas.height / 2); // Show on left side
            resetBall();
        } else if (ball.x - ball.radius > canvas.width) {
            score1++;
            updateScoreboard();
            showGoalAnimation(canvas.width * 0.75, canvas.height / 2); // Show on right side
            resetBall();
        }

        // Goal Animation Update
        if (goalAnim.active) {
            goalAnim.alpha -= 0.01; // Fade out speed
            goalAnim.y -= 0.5;      // Float up speed
            if (goalAnim.alpha <= 0) {
                goalAnim.active = false;
            }
        }
    }

    /* ==========================================
       5. RENDERING
       ========================================== */

    // Helper to draw a rounded rectangle (Pill shape)
    function drawBubbleBg(x, y, w, h, radius) {
        let r = x - w / 2;
        let b = y - h / 2;
        ctx.beginPath();
        ctx.moveTo(r + radius, b);
        ctx.lineTo(r + w - radius, b);
        ctx.quadraticCurveTo(r + w, b, r + w, b + radius);
        ctx.lineTo(r + w, b + h - radius);
        ctx.quadraticCurveTo(r + w, b + h, r + w - radius, b + h);
        ctx.lineTo(r + radius, b + h);
        ctx.quadraticCurveTo(r, b + h, r, b + h - radius);
        ctx.lineTo(r, b + radius);
        ctx.quadraticCurveTo(r, b, r + radius, b);
        ctx.fill();
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Draw Center Dashed Line
        ctx.strokeStyle = "rgba(255, 255, 255, 0.4)";
        ctx.lineWidth = 6;
        ctx.setLineDash([20, 15]);
        ctx.beginPath();
        ctx.moveTo(canvas.width / 2, 0);
        ctx.lineTo(canvas.width / 2, canvas.height);
        ctx.stroke();
        ctx.setLineDash([]);

        // Draw Player Circles (PNGs)
        ctx.drawImage(imgP1, p1.x - playerRadius, p1.y - playerRadius, playerDiameter, playerDiameter);
        ctx.drawImage(imgP2, p2.x - playerRadius, p2.y - playerRadius, playerDiameter, playerDiameter);

        // Draw Ball (PNG)
        ctx.drawImage(imgBall, ball.x - ball.radius, ball.y - ball.radius, ballSize, ballSize);

        // Draw Goal Animation
        if (goalAnim.active) {
            ctx.save();
            ctx.globalAlpha = Math.max(0, goalAnim.alpha);

            // Draw white pill background with shadow
            ctx.fillStyle = "#fff";
            ctx.shadowColor = "rgba(0,0,0,0.3)";
            ctx.shadowBlur = 10;
            ctx.shadowOffsetY = 5;
            drawBubbleBg(goalAnim.x, goalAnim.y, 200, 80, 40);

            // Draw Text
            ctx.shadowBlur = 0;
            ctx.shadowOffsetY = 0;
            ctx.fillStyle = "#e74c3c"; // Red text
            ctx.font = "bold 40px 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText("ГОЛ!", goalAnim.x, goalAnim.y + 2);

            ctx.restore();
        }
    }

    function drawPauseScreen() {
        ctx.fillStyle = "rgba(0, 0, 0, 0.6)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "white";
        ctx.font = "bold 60px 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("ПАУЗА", canvas.width / 2, canvas.height / 2 + 20);
    }

    /* ==========================================
       6. GAME LOOP 
       ========================================== */
    function gameLoop() {
        if (!isPlaying || isPaused) return;
        update();
        draw();
        requestAnimationFrame(gameLoop);
    }
</script>
